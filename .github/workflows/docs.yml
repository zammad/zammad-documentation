name: Documentation

# Controls when the workflow will run.
on:

  # Allow the workflow to be reusable.
  workflow_call:
    inputs:
      docs_path:
        description: Path to the documentation directory, relative to the repository root.
        required: false
        default: .
        type: string
      system_dependencies:
        description: Optional list of system dependencies to install via `apt` command, separated by spaces.
        required: false
        default: gettext
        type: string
      python_version:
        description: The version of Python binary to use.
        required: false
        default: '3.11'
        type: string
      requirements_path:
        description: Path to the `requirements.txt`, relative to the repository root.
        required: false
        default: requirements.txt
        type: string
      check_translations:
        description: Build the translated languages with warnings treated as errors, to catch broken markup in translations.
        required: false
        default: false
        type: boolean
      translation_languages:
        description: Space separated language codes to check, must match the directories below `locale/`.
        required: false
        default: de it pt_BR sr
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 50

    - name: Install System Dependencies
      shell: bash -eux {0}
      run: |
        sudo apt-get -q -y update
        sudo apt-get -q -y install ${{ inputs.system_dependencies }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Python Dependencies
      shell: bash -eux {0}
      run: |
        python -m pip install --upgrade --no-cache-dir pip setuptools
        python -m pip install --upgrade --no-cache-dir sphinx
        python -m pip install --exists-action=w --no-cache-dir -r ${{ inputs.requirements_path }}

    - name: Check RST Syntax
      shell: bash -eux {0}
      run: |
        python -m pip install --upgrade --no-cache-dir 'rstcheck[sphinx]<=6.1.0'
        rstcheck --warn-unknown-settings --recursive **/*.rst

    # Runs only on Pull Requests and if they contain changes.
    - name: Check for Outstanding Code Comments
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha != github.sha }}
      shell: bash -eux {0}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        COMMENT_KEYWORD: ${{ format('{0}{1}{2}{3}', 'T', 'O', 'D', 'O') }} # HA!
      run: |
        COMMENTS=$(git diff $BASE_SHA... --color=always | perl -wlne 'print $1 if /^\e\[32m\+\e\[m\e\[32m(.*)\e\[m$/' | grep $COMMENT_KEYWORD || true)
        if [ -n "$COMMENTS" ]; then
          echo "::warning title=New $COMMENT_KEYWORD comments found!::Found $COMMENT_KEYWORD comments, please check if this was intentional or not..."
          echo "$COMMENTS"
        fi

    - name: Check Translation Sources
      shell: bash -eux {0}
      run: |
        if [[ -d "locale" ]]; then
          make gettext
          if git status --short | grep " M locale/"; then
            echo "::error title=Translation sources are out-of-date!::Please update translation sources with 'make gettext' command..."
            exit 1
          fi
        fi

    # Sphinx only reports broken markup in a translation (a translated link
    # target, a missing backtick around a role) when that language is built.
    # Build every published language with warnings treated as errors, so a
    # broken translation coming in via Weblate fails the pull request. The
    # dummy builder reads and translates all sources but writes no output.
    - name: Check Translations
      if: ${{ inputs.check_translations }}
      shell: bash -eu {0}
      run: |
        cd ${{ inputs.docs_path }}
        failed=()
        for lang in ${{ inputs.translation_languages }}; do
          echo "::group::Build $lang"
          python -m sphinx -T -E -W --keep-going -q -b dummy -d _build/check-$lang/doctrees -D language=$lang -w _build/check-$lang.log . _build/check-$lang/out || failed+=("$lang")
          echo "::endgroup::"
        done
        if (( ${#failed[@]} )); then
          echo
          echo "Broken translations, fix these strings in Weblate:"
          for lang in "${failed[@]}"; do
            sed -E "s|^$PWD/||; s|:<translated>:[0-9]+||; s/^/  $lang: /" "_build/check-$lang.log" | sort -u | tee >(sed -E 's/^  /::error title=Broken translation::/') 
          done
          exit 1
        fi

    - name: Build Documentation
      shell: bash -eux {0}
      env:
        # NB: Disable failure on warnings when all translation issues are handled.
        fail_on_warning: "-W --keep-going"
      run: |
        cd ${{ inputs.docs_path }}
        python -m sphinx -T -E $fail_on_warning -b html -d _build/doctrees -D language=en . _build/html

    - name: Compute short SHA
      id: sha
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload html Artifact
      id: html
      uses: actions/upload-artifact@v7
      with:
        name: html-${{ steps.sha.outputs.sha_short }}
        path: ${{ inputs.docs_path }}/_build/html/

    - name: Post Comment to PR with Artifact Links
      # Runs only on Pull Requests from the same repository (not from forks).
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: thollander/actions-comment-pull-request@v3
      with:
        comment-tag: artifacts
        message: |
          ### Artifacts

          Produced during runtime

          📦 [html-${{ steps.sha.outputs.sha_short }}](${{ steps.html.outputs.artifact-url }})
